name: CI

# Delivery model: Vercel auto-deploys `frontend/` and Render auto-deploys
# `backend/` on every push to main. This workflow is the quality gate in
# front of both — each job below shows its own ✅/❌ symbol on the commit,
# and the `report` job prints the full scoreboard.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        pkg: ["@careplus/backend", "@careplus/frontend"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w ${{ matrix.pkg }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: mongodb://localhost:27017/careplus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w @careplus/backend

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contract check
        run: |
          npm run build -w @careplus/backend
          node backend/dist/index.js > /tmp/api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/v1/openapi.json -o /tmp/live.json && break
            sleep 2
          done
          test -f /tmp/live.json || (echo "::error::API did not start — see /tmp/api.log" && cat /tmp/api.log && kill $API_PID && exit 1)
          # Canonicalize both sides (key order + whitespace + BOM) so only real
          # contract changes fail the gate, never formatting differences.
          node -e "const fs=require('fs');for(const f of ['/tmp/live.json','docs/openapi.snapshot.json']){fs.writeFileSync(f+'.canon',JSON.stringify(JSON.parse(fs.readFileSync(f,'utf8')))+'\n')}"
          diff -u docs/openapi.snapshot.json.canon /tmp/live.json.canon || (echo "::error::OpenAPI contract changed — regenerate the snapshot against a running API and commit" && kill $API_PID && exit 1)
          kill $API_PID || true

  # Advisory only: surfaces new CVEs without failing the build.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # ✅/❌ scoreboard printed on every run — the symbol summary you asked for.
  report:
    if: always()
    needs: [format, lint, typecheck, test, build, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scoreboard
        run: |
          symbol() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          {
            echo "## CI scoreboard for \`${{ github.sha }}\`"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Format | $(symbol '${{ needs.format.result }}') ${{ needs.format.result }} |"
            echo "| Lint | $(symbol '${{ needs.lint.result }}') ${{ needs.lint.result }} |"
            echo "| Typecheck | $(symbol '${{ needs.typecheck.result }}') ${{ needs.typecheck.result }} |"
            echo "| Tests | $(symbol '${{ needs.test.result }}') ${{ needs.test.result }} |"
            echo "| Build | $(symbol '${{ needs.build.result }}') ${{ needs.build.result }} |"
            echo "| Contract | $(symbol '${{ needs.contract.result }}') ${{ needs.contract.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
